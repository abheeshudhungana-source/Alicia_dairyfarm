<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Summary</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f5f5f5; 
            padding: 20px; 
            text-align: center; 
        }
        .summary-card { 
            background: white; 
            padding: 40px; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            display: inline-block; 
            margin-top: 50px; 
        }
        .count { 
            font-size: 72px; 
            color: #007bff; 
            font-weight: bold; 
            margin: 20px 0; 
        }
        h1 { 
            color: #333; 
        }
        p { 
            color: #666; 
            font-size: 18px; 
        }
    </style>
</head>
<body>
    <div class="summary-card">
        <h1>Total Inventory Records</h1>
        <div class="count" id="rowCount">Loading...</div>
        <p>This is the total number of rows from the dairy dataset.</p>
    </div>

    <script>
        async function loadCount() {
            try {
                const response = await fetch('dairy_dataset.csv');
                const text = await response.text();
                
                Papa.parse(text, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        // Display the total number of rows
                        document.getElementById('rowCount').textContent = results.data.length.toLocaleString();
                    }
                });
            } catch (error) {
                document.getElementById('rowCount').textContent = "Error";
                console.error(error);
            }
        }
        loadCount();
    </script>
</body>
</html>
